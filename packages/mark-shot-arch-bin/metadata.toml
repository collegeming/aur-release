# aur-release package manifest for mark-shot-arch-bin.
# Rendered together with PKGBUILD.template by tools/update_package.py.
#
# History: 0.1.x was built by us from source because upstream's aarch64 asset
# was linked against Ubuntu's FFmpeg 6 and shipped without the layer-shell
# plugin (jswysnemc/mark-shot#155, #157). The 0.2.x Rust rewrite sizes that
# differently: upstream now publishes real Arch/ALARM packages
# (mark-shot-bin-<ver>-1-<arch>.pkg.tar.zst) whose dependencies are plain
# system libraries. So this package is now a thin repackage of those binaries;
# no build step is involved.
#
# Note: AUR also carries first-party mark-shot-bin / mark-shot 0.2.x packages,
# so this package is effectively redundant -- it keeps working for existing
# users until it is deleted or disowned.

pkgname = "mark-shot-arch-bin"

maintainer = "colegeming <collegeming@outlook.com>"

[upstream]
owner = "jswysnemc"
repo = "mark-shot"

[tag]
# v0.2.0 -> 0.2.0
strip_prefix = "v"

[assets.x86_64]
names = ["mark-shot-bin-{pkgver}-1-x86_64.pkg.tar.zst"]

[assets.aarch64]
names = ["mark-shot-bin-{pkgver}-1-aarch64.pkg.tar.zst"]
