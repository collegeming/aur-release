# aur-release package manifest for snishaper-bin.
# Rendered together with PKGBUILD.template by tools/update_package.py.

pkgname = "snishaper-bin"

# Maintainer identity used in the PKGBUILD header and as git commit author.
maintainer = "colegeming <collegeming@outlook.com>"

[upstream]
owner = "SnishaperTeam"
repo = "SniShaper"
# Stable-only from v1.30.0 on: that release ships Linux builds for both arches
# (snishaper-linux-x64.tar.gz + snishaper-linux-arm64.tar.gz), so the original
# reason for tracking prereleases -- stable v1.28 carried Windows-only assets
# and the Linux build existed only in the v1.29.0-beta.x series -- no longer
# holds. Keeping it on would publish future alphas to AUR users, since
# vercmp orders e.g. 1.31.0alpha1 ABOVE the current stable 1.30.0.
prerelease = false

[tag]
# v1.29.0-beta.3 -> 1.29.0-beta.3 (prefix stripped)
strip_prefix = "v"
# ...then sanitize the hyphen away: 1.29.0beta3.
# Hyphens are forbidden in pkgver, and keeping the alpha/beta/rc suffix makes
# the prerelease sort older than the final release (vercmp: 1.0beta < 1.0).
sanitize = ["-(alpha|beta|rc)\\.", "\\1"]

[assets.x86_64]
# Upstream renamed the Linux asset in v1.29.1 (amd64 -> x64). List both so old
# and new releases both resolve; the updater picks whichever exists.
names = ["snishaper-linux-x64.tar.gz", "snishaper-linux-amd64.tar.gz"]

[assets.aarch64]
# Upstream started shipping an aarch64 GUI tarball in v1.29.1 (verified: the
# archive's SniShaper is an ELF aarch64 binary with the same ./SniShaper
# ./config/ ./rules/ layout). Declaring it here makes the AUR package
# multi-arch; before this the PKGBUILD said arch=('x86_64') and pacman refused
# to install on Arch Linux ARM. Releases that lack this asset are skipped by
# resolve_release, which requires every configured arch to be present.
names = ["snishaper-linux-arm64.tar.gz"]

# Files that live in the repo rather than in a release asset. Pin them to the
# release TAG (immutable) instead of `main`: a moving branch changes content
# under a fixed checksum and breaks every build. The updater downloads and
# hashes them on each run, so the checksums are never stale.
[extras.icon]
url = "https://raw.githubusercontent.com/SnishaperTeam/SniShaper/{{tag}}/Assets/AppList.targetsize-256_altform-unplated.png"

[extras.license]
url = "https://raw.githubusercontent.com/SnishaperTeam/SniShaper/{{tag}}/LICENSE"
