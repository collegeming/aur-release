# aur-release package manifest for kimi-code-desktop-bin.
# Rendered together with PKGBUILD.template by tools/update_package.py.

pkgname = "kimi-code-desktop-bin"

# Maintainer identity used in the PKGBUILD header and as git commit author.
maintainer = "colegeming <collegeming@outlook.com>"

[upstream]
# Kimi Code Desktop is a *separate product* from the CLI (see
# kimi-code-bin): its own version line (1.x vs the CLI's 2.x), and no GitHub
# repository or release assets at all -- only vendor-hosted installers. The
# sole machine-readable "a new version is out" signal is the feed its own
# auto-updater reads, named in the app's resources/app-update.yml:
#   provider: generic, url: https://code.kimi.com/kimi-code/desktop/
kind = "electron-updater"
# Temporary pin while upstream's feed still points below the published AUR
# version (vendor rolled 1.3.5 back to 1.3.3 after we had already published
# 1.3.5-1, and AUR cannot downgrade). Restored to the real feed below once
# 1.3.5-2 is out; see _feeds/kimi-1.3.5.yml.
feed = "https://raw.githubusercontent.com/collegeming/aur-release/main/_feeds/kimi-1.3.5.yml"
# feed = "https://code.kimi.com/kimi-code/desktop/latest-linux.yml"

[build]
# The vendor ships Linux only for x86_64. We forward that .deb unchanged and
# build the missing aarch64 package ourselves: same app payload with the
# official Electron arm64 runtime swapped in and node-pty rebuilt for that ABI
# (the approach macOS-Terminal/deepseek-harness-desktop-linux uses for its
# macOS payload). Script: packages/kimi-code-desktop-bin/build-aarch64.sh.
kind = "self"
repo = "collegeming/aur-release"
release_tag = "aur-built-latest"
arches = ["aarch64"]

# x86_64: the vendor installer, straight from the update feed.
[assets.x86_64]
names = ["KimiCode-{pkgver}-linux-amd64.deb"]

# aarch64: our build artifact.
[assets.aarch64]
names = ["kimi-code-desktop-bin-{pkgver}-1-aarch64.pkg.tar.zst"]
