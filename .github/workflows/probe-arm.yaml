name: probe-arm
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: A. register binfmt then run arm64
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install arm64
          echo "--- handlers ---"
          ls /proc/sys/fs/binfmt_misc/ | head
          echo "--- exec test ---"
          docker run --rm --platform linux/arm64 alpine uname -m

      - name: B. ALARM rootfs: pacman path + chroot under emulation
        run: |
          curl -fsSL --retry 2 -o /tmp/alarm.tar.gz http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          ls -la /tmp/alarm.tar.gz
          sudo mkdir -p /arch
          sudo tar --numeric-owner -xzf /tmp/alarm.tar.gz -C /arch
          echo "--- pacman? ---"
          ls -la /arch/usr/bin/pacman
          echo "--- chroot exec test ---"
          docker run --rm --privileged --platform linux/arm64 -v /arch:/arch alpine \
            chroot /arch /usr/bin/pacman --version
