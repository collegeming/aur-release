name: probe-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 --version
          echo "--- mark-shot ---"
          python3 tools/update_package.py check packages/mark-shot-arch-bin
          echo "exit=$?"
          echo "--- solomd ---"
          python3 tools/update_package.py check packages/solomd-arch-bin
          echo "exit=$?"
