name: probe-genoffice-arm

# Temporary probe: check whether upstream's build system really produces a
# working Linux arm64 build with GENOFFICE_LINUX_ARM64=1.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/lib/android 2>/dev/null || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Toolchain
        run: |
          node -v && npm -v
          cargo --version && rustc --version

      - name: Clone upstream at the release tag
        run: git clone --depth 1 --branch v0.13.18 https://github.com/genspark-ai/genoffice.git src

      - name: npm ci
        working-directory: src
        run: npm ci --no-audit --no-fund

      - name: Build Linux arm64 packages
        working-directory: src
        env:
          GENOFFICE_LINUX_ARM64: "1"
        run: npm run dist:linux

      - name: List outputs
        if: always()
        run: |
          find src/apps/shell/dist -maxdepth 2 -type f -printf '%p %s\n' 2>/dev/null | sort | head -40 || true
          df -h /

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-arm-artifacts
          path: |
            src/apps/shell/dist/*.deb
            src/apps/shell/dist/*.AppImage
          if-no-files-found: warn
          retention-days: 7
