name: probe-arm-runner
on:
  workflow_dispatch:

jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Am I really arm64?
        run: uname -m && nproc && free -h | head -2
      - name: Can Docker run an arm64 container natively?
        run: docker run --rm --platform linux/arm64 alpine uname -m
